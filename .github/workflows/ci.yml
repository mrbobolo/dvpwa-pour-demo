name: CI + Checkmarx One

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Droits minimaux du GITHUB_TOKEN (lecture du code, écriture des commentaires de PR)
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          #cache: maven
     # - run: mvn -B clean verify

  checkmarx-scan:
    needs: build            # attend la réussite du build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Scan Checkmarx One
        uses: checkmarx/ast-github-action@main   # voir la note sur le versionnage
        with:
          base_uri: ${{ secrets.CX_BASE_URI }}
          tenant: ${{ secrets.CX_TENANT }}
          client_id: ${{ secrets.CX_CLIENT_ID }}
          client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          project_name: "dvpwa-pour-demo"
          branch_name: "master"
          scan_types: "sast,sca,iac-security,container-security, api-security"

           
